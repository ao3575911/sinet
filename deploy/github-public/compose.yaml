# TLS terminates at operator-managed host ingress. No public HTTP listener.
# Set SINET_GITHUB_IMAGE to the reviewed registry image@sha256:... digest.
services:
  gateway:
    image: ${SINET_GITHUB_IMAGE:?Set reviewed immutable gateway image digest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SINET_GITHUB_LISTEN: "0.0.0.0:8090"
      GOMEMLIMIT: "96MiB"
      GOMAXPROCS: "1"
    ports: ["127.0.0.1:18090:8090"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 32
    ulimits:
      nofile: {soft: 256, hard: 256}
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/connector-github", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
