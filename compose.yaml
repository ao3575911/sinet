services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: projectname
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: projectname
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectname"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    environment:
      APP_ENV: development
      APP_HTTP_ADDR: 0.0.0.0:8080
      APP_PUBLIC_URL: http://127.0.0.1:8080
      DATABASE_URL: postgres://projectname:local-development-only@db:5432/projectname?sslmode=disable
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: no-reply@project-name.example
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata:
