name: dependency-security
on:
  schedule:
    - cron: '17 23 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/security.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
