name: community-setup
on:
  push:
    branches: [main]
    paths: ['.github/community.json', '.github/workflows/community.yml', 'scripts/community.cjs']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v8
        with:
          script: |
            const synchronize = require('./scripts/community.cjs');
            await synchronize({ github, context, core });
