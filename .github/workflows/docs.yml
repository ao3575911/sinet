name: documentation-pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/wiki/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published documentation content
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p work
          curl --proto '=https' --proto-redir '=https' --retry 6 --retry-delay 3 --retry-all-errors --max-time 15 -fsSL "$PAGES_URL" -o work/site-index.html
          python3 -c 'from pathlib import Path; html=Path("work/site-index.html").read_text(); assert "<h1>SINet documentation</h1>" in html; assert "/sinet/quickstart.html" in html'
