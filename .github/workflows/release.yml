name: signed-prototype-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: sinet
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: sinet
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sinet -d sinet"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://sinet:local-development-only@127.0.0.1:5432/sinet?sslmode=disable
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify signed source and version
        run: |
          python3 scripts/check_version.py --tag "$RELEASE_TAG"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          mkdir -p work
          git show origin/main:.github/release/allowed_signers > work/release-allowed-signers
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$PWD/work/release-allowed-signers"
          git verify-tag "$RELEASE_TAG"
          release_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          git verify-commit "$release_commit"
          git merge-base --is-ancestor "$release_commit" origin/main
      - run: make check integration
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: python3 scripts/package_release.py
      - name: Sign build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'
      - name: Verify provenance and package checksums before publication
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
          done
          (cd dist && sha256sum -c SHA256SUMS)
      - run: python3 scripts/publish_release.py
