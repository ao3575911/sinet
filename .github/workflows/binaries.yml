name: portable-binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['cmd/SINet/**', 'internal/cli/**', 'internal/client/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/binaries.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: make check cross
      - run: sha256sum bin/SINet-* > bin/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SINet-portable-builds
          path: |
            bin/SINet-*
            bin/SHA256SUMS
          retention-days: 14
