name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: sinet
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: sinet
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sinet -d sinet" --health-interval 2s
          --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://sinet:local-development-only@127.0.0.1:5432/sinet?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node --test scripts/community.test.cjs
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: make check integration cross
      - name: Isolated gateway container controls and health
        run: |
          docker build -f deploy/github-public/Dockerfile -t sinet-github:ci .
          export SINET_GITHUB_IMAGE=sinet-github:ci
          trap 'docker compose -p sinet-github-ci -f deploy/github-public/compose.yaml down' EXIT
          docker compose -p sinet-github-ci -f deploy/github-public/compose.yaml up -d --no-build
          gateway_id=$(docker compose -p sinet-github-ci -f deploy/github-public/compose.yaml ps -q gateway)
          for _ in $(seq 1 30); do
            if docker exec "$gateway_id" /connector-github healthcheck; then break; fi
            sleep 1
          done
          docker exec "$gateway_id" /connector-github healthcheck
          test "$(docker inspect --format '{{.Config.User}}' "$gateway_id")" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$gateway_id")" = true
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$gateway_id")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$gateway_id")" = '["no-new-privileges:true"]'
          test "$(docker inspect --format '{{len .Mounts}}' "$gateway_id")" = 0
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"owner":"other","repository":"sinet"}' http://127.0.0.1:18090/repository_summary)
          test "$code" = 400
      - name: Install the tested browser fixture runner
        run: |
          python3 -m pip install playwright==1.62.0 pyte==0.8.2
          python3 -m playwright install --with-deps chromium
      - name: Real CLI, SMTP and TUI journey
        run: |
          docker compose up -d mailpit
          make build
          mkdir -p work
          ./bin/server >work/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          python3 tests/smoke.py
          python3 tests/tui_smoke.py
          python3 tests/dashboard_pty.py
          python3 tests/wallet_browser.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
